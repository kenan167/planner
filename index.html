<!--
SETUP / SECURITY NOTES
1. Open SETTINGS and paste your Firebase webConfig (Firebase console > Project settings > Web app). No config = LOCAL ONLY. The Firestore region (e.g. europe-west3) is chosen when the database is created in the console; this client code needs no region setting.
2. VAULT ID = SHA-256( PBKDF2-SHA256(PIN, salt, 200k iterations) + salt ), 64 hex chars. DEFAULT SALT is c7542a0dc13bb51c80e897b4d2e2dc48 (hard-coded as requested).
   A salt that is visible in this file is public: anyone holding this file can enumerate all 10,000 PINs against vault ids. Only the Firestore rules below protect you then.
   To get a secret salt, use "LINK EXISTING VAULT" on the lock screen with your own random 32-hex value.
3. Firestore data is unencrypted. Suggested rules (blocks listing vaults): match /vaults/{id} { allow get, create, update: if true; allow list, delete: if false; }
4. Sync is offline-first, last-write-wins on one document per vault; a pending flag is flushed when the connection returns.
5. Gemini key + Firebase config live only in this browser's localStorage and are NOT included in backups. Scanned images/text go to Google. LaTeX is rendered offline as Unicode math (raw LaTeX is kept). Bump CACHE in sw.js after updates.
-->

<script>
/* ---------- Config ---------- */
// Default model gemini-3.5-flash-lite; falls back to gemini-2.5-flash only if the first is missing (404).
const MODELS=['gemini-3.5-flash-lite','gemini-2.5-flash'];
/* ---------- Helpers (DOM built with textContent only: XSS-safe) ---------- */
const $=id=>document.getElementById(id);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k==='value')e.value=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x instanceof Node?x:document.createTextNode(x??'')));return e};
const pad=n=>String(n).padStart(2,'0'),uid=()=>Math.random().toString(36).slice(2,9);
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>dk(new Date());
const tt=ts=>new Date(ts).toTimeString().slice(0,5),tsOf=(d,t)=>new Date(d+'T'+t+':00').getTime();
const num=v=>{const n=parseFloat(String(v).trim().replace(',','.'));return isFinite(n)?n:null};
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2600)};
const hap=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}};
/* ---------- Sound (Web Audio synthesizer) ---------- */
let AC;
function tone(f0,f1,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+d);
  g.gain.setValueAtTime(v||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
function snd(k){
  if(localStorage.getItem('jv.mute')==='1')return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;
    switch(k){
      case'key':tone(880,880,t,.04);break;
      case'click':tone(660,660,t,.03);break;
      case'unlock':[0,.09,.18,.27].forEach((o,i)=>tone(300*Math.pow(1.5,i),600*Math.pow(1.5,i),t+o,.16,'triangle',.07));tone(1500,2400,t+.38,.35,'sine',.05);break; // vault unlock: rising sweep + shimmer
      case'ocr':case'scan':[0,.14,.28].forEach(o=>tone(1400,1400,t+o,.08,'square',.04));break; // triple-beep confirmation
      case'warn':tone(880,660,t,.18,'sawtooth',.06);tone(880,660,t+.24,.18,'sawtooth',.06);tone(440,330,t+.48,.3,'sawtooth',.06);break; // system warning alert
      case'deny':tone(190,120,t,.28,'sawtooth');break;
      case'err':tone(300,200,t,.12,'sawtooth');tone(200,140,t+.14,.18,'sawtooth');break;
      case'ok':[520,780,1040].forEach((f,i)=>tone(f,f,t+i*.06,.1));break;
    }
  }catch(e){}
}
document.addEventListener('click',e=>{if(e.target.closest('button,label.drop')&&!e.target.closest('#keys'))snd('click')});
/* ---------- Speech output (Web Speech API) ---------- */
const ttsOn=()=>localStorage.getItem('jv.tts')==='1';
function speak(text){
  if(!ttsOn()||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(text).replace(/[*_`#>]/g,'').slice(0,1500)),vs=speechSynthesis.getVoices();
    u.lang='en-GB';u.rate=1.02;u.pitch=.9;const v=vs.find(x=>/en-GB/i.test(x.lang))||vs.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}
}
function tglVoice(){const b=h('button',{class:'btn',onclick:()=>{
  if(!('speechSynthesis' in window)){toast('SPEECH OUTPUT NOT SUPPORTED HERE');return}
  const on=!ttsOn();localStorage.setItem('jv.tts',on?'1':'0');if(!on)speechSynthesis.cancel();b.textContent=on?'VOICE: ON':'VOICE: OFF';if(on)speak('Voice output online.')}},ttsOn()?'VOICE: ON':'VOICE: OFF');return b}
/* ---------- Themes (CSS root variables) ---------- */
const THEMES={cyan:['Stark Cyan','#00f3ff','0,243,255'],green:['Matrix Green','#00ff41','0,255,65'],amber:['Amber Gold','#ffb700','255,183,0'],red:['Red Alert','#ff2d3d','255,45,61']};
function applyTheme(n){const t=THEMES[n]||THEMES.cyan,r=document.documentElement.style;r.setProperty('--primary-color',t[1]);r.setProperty('--pc-rgb',t[2]);localStorage.setItem('jv.theme',THEMES[n]?n:'cyan')}
function themeSwatches(){const c=localStorage.getItem('jv.theme')||'cyan';
  return Object.keys(THEMES).map(k=>h('button',{class:'btn',style:`border-color:${THEMES[k][1]};color:${THEMES[k][1]};flex:1;min-width:120px`,onclick:()=>{applyTheme(k);snd('ok');toast('THEME: '+THEMES[k][0].toUpperCase());settingsModal()}},(c===k?'● ':'')+THEMES[k][0]))}
applyTheme(localStorage.getItem('jv.theme')||'cyan');
/* ---------- State, vault & offline-first sync ---------- */
const blank=()=>({t:0,weight:{},sleep:{},steps:{},hw:[],refuel:{},gym:{},exams:[],study:{},run:null,acad:[],pushups:{},targets:{kcal:2800,pro:150,carb:300,fat:80,caf:400}});
let S=blank(),K='',vault='',ref=null,tm=null,cur=null;
const enc=new TextEncoder(),hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',enc.encode(s)));
const DEFAULT_SALT='c7542a0dc13bb51c80e897b4d2e2dc48';
const getSalt=()=>{let s=localStorage.getItem('jv.salt');if(!s){s=DEFAULT_SALT;localStorage.setItem('jv.salt',s)}return s};
async function vaultId(pin,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode('stark-os:'+salt),iterations:200000},km,256);
  return sha(hex(bits)+':'+salt); // 64-char hex Firestore document id
}
const setSync=t=>$('sy').textContent=t;
const pending=()=>localStorage.getItem('jv.pend')==='1';
function save(){S.t=Date.now();localStorage.setItem(K,JSON.stringify(S));localStorage.setItem('jv.pend','1');clearTimeout(tm);tm=setTimeout(push,600);render()}
function push(){
  if(!ref)return;
  if(!navigator.onLine){setSync('OFFLINE · QUEUED');return}
  const t=S.t;
  ref.set({json:JSON.stringify(S),t}).then(()=>{if(S.t===t)localStorage.setItem('jv.pend','0');setSync('LINKED')},e=>{console.error('[sync] write failed',e);setSync('SYNC ERROR · QUEUED')});
}
addEventListener('online',()=>{if(ref){setSync('RECONNECTED');if(pending())push()}});
addEventListener('offline',()=>{if(ref)setSync(pending()?'OFFLINE · QUEUED':'OFFLINE')});
function initCloud(){
  let cfg=null;try{cfg=JSON.parse(localStorage.getItem('jv.fbcfg'))}catch(e){}
  if(!window.firebase||!cfg||!cfg.apiKey||!cfg.projectId){setSync('LOCAL ONLY');return}
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    ref=firebase.firestore().collection('vaults').doc(vault);
    ref.onSnapshot(s=>{
      if(s.metadata.hasPendingWrites)return;
      if(s.exists){try{const r={...blank(),...JSON.parse(s.data().json)};
        if(r.t>S.t){S=r;localStorage.setItem(K,JSON.stringify(S));localStorage.setItem('jv.pend','0');render()}else if(S.t>r.t)push()}catch(e){console.error(e)}}
      else if(S.t)push();
      setSync(navigator.onLine?'LINKED':'OFFLINE · QUEUED');
    },e=>{console.error('[sync] listen failed',e);setSync('SYNC ERROR')});
    if(pending())push();
  }catch(e){console.error('[sync] init failed',e);setSync('SYNC ERROR')}
}
/* ---------- Passcode ---------- */
let pin='';
const drawDots=()=>$('dots').replaceChildren(...[0,1,2,3].map(i=>h('i',{class:i<pin.length?'f':''})));
['1','2','3','4','5','6','7','8','9','CLR','0','⌫'].forEach(k=>$('keys').append(h('button',{class:'btn',onclick:()=>{hap();snd('key');
  if(k==='CLR')pin='';else if(k==='⌫')pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;drawDots();if(pin.length===4)unlock()}},k)));
async function unlock(){
  const vid=await vaultId(pin,getSalt()),ph=await sha('ph:'+vid),have=localStorage.getItem('jv.ph2');
  if(have&&have!==ph){snd('warn');$('lt').textContent='ACCESS DENIED';pin='';drawDots();return}
  localStorage.setItem('jv.ph2',ph);vault=vid;K='jv.'+vid.slice(0,16);
  const old='jv.'+(await sha('jv-vault:'+pin)).slice(0,16); // migrate data saved before salted vault ids
  if(!localStorage.getItem(K)&&localStorage.getItem(old))localStorage.setItem(K,localStorage.getItem(old));
  pin='';try{S={...blank(),...JSON.parse(localStorage.getItem(K))}}catch(e){S=blank()}
  S.targets={...blank().targets,...S.targets};
  snd('unlock');$('lock').classList.remove('on');setSync('LOCAL');initCloud();render();toast('ACCESS GRANTED — WELCOME BACK, SIR');
}
$('lr').onclick=()=>{if(confirm('Forget the passcode on this device? Local data stays until browser data is cleared.')){localStorage.removeItem('jv.ph2');$('lt').textContent='NEW PASSCODE: ENTER 4 DIGITS'}};
$('ls').onclick=()=>{const v=(prompt('Paste the vault salt from your other device (Settings > Vault salt):')||'').trim().toLowerCase();
  if(/^[0-9a-f]{16,64}$/.test(v)){localStorage.setItem('jv.salt',v);localStorage.removeItem('jv.ph2');$('lt').textContent='SALT LINKED — ENTER YOUR PASSCODE'}else if(v)toast('INVALID SALT FORMAT')};
$('lt').textContent=localStorage.getItem('jv.ph2')?'ENTER 4-DIGIT PASSCODE':'SET A NEW 4-DIGIT PASSCODE';
drawDots();$('lock').classList.add('on');
/* ---------- Modal ---------- */
function modal(title,mk,live=true){cur={mk,live};$('mt').textContent=title;$('mb').replaceChildren(mk());$('modal').classList.add('on')}
$('mx').onclick=()=>{$('modal').classList.remove('on');cur=null};
/* ---------- Gemini ---------- */
const key=()=>localStorage.getItem('gemini_api_key')||localStorage.getItem('jv.key')||'';
async function gem(parts,json,hist){
  if(!key()){toast('NO API KEY — OPEN SETTINGS');throw new Error('key')}
  let last;
  for(const m of MODELS){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key()},
      body:JSON.stringify({contents:[...(hist||[]),{role:'user',parts}],generationConfig:json?{responseMimeType:'application/json'}:{}})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){
      const t=j.candidates?.[0]?.content?.parts?.map(p=>p.text).join('')||'';
      if(!json)return t;
      try{return JSON.parse(t)}catch(e){console.error('[Gemini] non-JSON reply:',t);throw new Error('Model returned non-JSON: '+t.slice(0,80))}
    }
    console.error('[Gemini] request failed',{model:m,status:r.status,body:j});
    last=new Error(`${r.status} ${j.error?.status||''} ${j.error?.message||'API error'} [${m}]`.replace(/\s+/g,' '));
    if(r.status!==404)throw last; // only try the next model when this one is missing
  }

const SR=/(\d+(?:[.,]\d+)?)\s*(?:kg|kilo)?\s*(?:[x×*@]|for)\s*(\d+)|(\d+)\s*reps?\b/gi;
function pw(raw){const o=[];raw.split(/\n/).forEach(l=>{l=l.replace(/\s*[(\[][^)\]]*[)\]]/g,' ').trim();const m=[...l.matchAll(SR)];if(!m.length)return;
  const n=l.slice(0,m[0].index).replace(/\b(first|second|third|fourth|fifth|1st|2nd|3rd|4th|5th|set)\b[:\s-]*/gi,' ').replace(/\s+/g,' ').replace(/^[\s\-–•*]+|[\s:,\-–]+$/g,'');
  o.push({ex:n||'Exercise',sets:m.map(x=>x[1]!=null?[parseFloat(x[1].replace(',','.')),+x[2]]:[0,+x[3]])})});return o}
const fm=s=>s[0]?`${s[0]} kg × ${s[1]}`:`BW × ${s[1]}`;
const topSet=sets=>sets.reduce((a,s)=>s[0]>a[0]||(s[0]===a[0]&&s[1]>a[1])?s:a,[-1,0]);

  return h('div',{},ta,h('div',{class:'row'},h('button',{class:'btn am',onclick:()=>{const p=pw(ta.value);if(p.length)S.gym[T]=p;else delete S.gym[T];save();toast(p.length?`${p.length} EXERCISES LOGGED`:'LOG CLEARED')}},'COMMIT'),h('button',{class:'btn',onclick:recapModal},'WEEKLY RECAP')),
    (S.gym[T]||[]).map(e=>h('div',{class:'li'},h('span',{},e.ex),h('span',{class:'mu'},e.sets.map(fm).join(' · ')))))})}
function recapModal(){modal('WEEKLY STRENGTH & HYPERTROPHY RECAP',()=>{
  const n=new Date(),ws=dk(new Date(n.getFullYear(),n.getMonth(),n.getDate()-((n.getDay()+6)%7))),by={};
  Object.keys(S.gym).sort().forEach(d=>S.gym[d].forEach(e=>{const k=e.ex.toLowerCase();(by[k]=by[k]||[]).push({d,name:e.ex,t:topSet(e.sets)})}));
  const rows=Object.values(by).filter(a=>a[a.length-1].d>=ws).map(a=>{const l=a[a.length-1],p=a[a.length-2];return h('div',{class:'li'},h('span',{},l.name),h('span',{style:'color:var(--cy)'},(p?fm(p.t)+' ➔ ':'')+fm(l.t)))});
  return h('div',{},h('div',{class:'sub'},'TOP SET PER EXERCISE · PREVIOUS ➔ LATEST'),rows.length?rows:h('div',{class:'mu',style:'margin-top:10px'},'No workouts logged this week.'))})}

const JP=`You are J.A.R.V.I.S. from Stark Industries: precise, dry-witted, concise, always English. Reply ONLY JSON: {"reply":"text","actions":[]}.
Allowed actions (use only when the user clearly asks to change data, otherwise actions must be []):
{"type":"add_homework","subject":"","title":"","description":"","due":"YYYY-MM-DD"}
{"type":"log_weight","kg":60.45}
{"type":"add_food","name":"","qty":"","kcal":0,"protein":0,"carbs":0,"fat":0,"caffeine":0}
{"type":"start_study"} {"type":"stop_study"} {"type":"log_study","minutes":45}
{"type":"set_targets","kcal":0,"protein":0,"carbs":0,"fat":0,"caffeine":0}
{"type":"add_pushups","reps":20}
{"type":"open","module":"study|weight|refuel|homework|academics|exams|strength|pushups|chat"}`;
function act(a){
  const T=today(),n=x=>Number(x)||0,str=(x,m=200)=>String(x??'').slice(0,m);
  switch(a.type){
    case'add_homework':S.hw.unshift({id:uid(),subj:str(a.subject||'General',60),title:str(a.title||'Task'),desc:str(a.description,1000),due:/^\d{4}-\d\d-\d\d$/.test(a.due||'')?a.due:'',done:0});return'HOMEWORK QUEUED: '+str(a.title,60);
    case'log_weight':{const k=n(a.kg);if(k<20||k>400)return null;S.weight[T]=k;return`MASS LOGGED: ${k} kg`}
    case'add_food':(S.refuel[T]=S.refuel[T]||[]).push({id:uid(),name:str(a.name||'Item',80),qty:str(a.qty,40),kcal:n(a.kcal),pro:n(a.protein),carb:n(a.carbs),fat:n(a.fat),caf:n(a.caffeine)});return'FUEL LOGGED: '+str(a.name,60);
    case'start_study':if(S.run)return null;S.run=Date.now();return'CHRONOMETER STARTED';
    case'stop_study':if(!S.run)return null;addSess(S.run,Date.now());S.run=null;return'CHRONOMETER STOPPED';
    case'log_study':{const m=n(a.minutes);if(m<=0||m>720)return null;addSess(Date.now()-m*6e4,Date.now());return`STUDY SESSION LOGGED: ${m} min`}
    case'set_targets':S.targets={kcal:n(a.kcal)||TG().kcal,pro:n(a.protein)||TG().pro,carb:n(a.carbs)||TG().carb,fat:n(a.fat)||TG().fat,caf:n(a.caffeine)||TG().caf};return'DAILY TARGETS UPDATED';
    case'add_pushups':{const r=Math.round(n(a.reps));if(r<=0||r>1000)return null;(S.pushups[T]=S.pushups[T]||[]).push({id:uid(),t:Date.now(),n:r});return`PUSH-UPS LOGGED: ${r}`}
    case'open':if(MODS[a.module]){setTimeout(MODS[a.module],0);return'OPENING '+String(a.module).toUpperCase()}return null;
  }
  return null;
}
function jarvisModal(){modal('J.A.R.V.I.S. COMMAND TERMINAL',()=>{
  const log=h('div',{}),inp=h('input',{type:'text',placeholder:'Command or question… e.g. "log weight 60.45" / "add physics homework due Friday"',enterkeyhint:'send'});

      h('button',{class:'btn',onclick:e=>{const m=localStorage.getItem('jv.mute')==='1';localStorage.setItem('jv.mute',m?'0':'1');e.target.textContent=m?'SOUND: ON':'SOUND: OFF';if(m)snd('ok')}},localStorage.getItem('jv.mute')==='1'?'SOUND: OFF':'SOUND: ON'),

// --- 2. SCI-FI BUTON SESİ (Web Audio API) ---
function playClickSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(800, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.04);
  } catch(e){}
}

// Tüm butonlara otomatik tıklama sesi bağlama
document.addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON' || e.target.closest('button') || e.target.classList.contains('btn')) {
    playClickSound();
  }
});

// --- 3. DAKTİLO / TYPING EFEKTİ ---
function typeWriter(element, text, speed = 15) {
  element.innerHTML = "";
  let i = 0;
  function type() {
    if (i < text.length) {
      element.innerHTML += text.charAt(i);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}
